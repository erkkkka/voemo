<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>VOEMEE UN!</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <header class="logo-header">
            <img src="icon.png" alt="VOEMEE UN! Logo" class="logo-img">
        </header>

        <section class="input-section">
            <div class="form-group">
                <label for="muscle-group">Lihasryhmä</label>
                <div class="select-wrapper">
                    <select id="muscle-group" onchange="updateExercises()">
                        <option value="Rinta">Rinta</option>
                        <option value="Selkä">Selkä</option>
                        <option value="Kädet & Olkapäät">Kädet & Olkapäät</option>
                        <option value="Jalat">Jalat</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="exercise">Liike</label>
                <div class="select-wrapper">
                    <select id="exercise">
                        <!-- JS täyttää dynaamisesti -->
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="weight">Paino (kg)</label>
                <input type="number" id="weight" inputmode="decimal" placeholder="0.0" step="0.5">
            </div>

            <div class="form-group">
                <label for="reps">Toistot (sarjat)</label>
                <input type="text" id="reps" placeholder="Esim. 8 6 6">
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="saveEntry()">Tallenna</button>
                <button class="btn-reset" onclick="clearFields()">Tyhjennä</button>
            </div>
        </section>

        <section class="history-section">
            <div class="history-header">
                <h2>Viimeisimmät</h2>
                <button class="btn-clear-all" onclick="clearHistory()">Tyhjennä historia</button>
            </div>
            <div id="history-list">
                <!-- JS lataa tähän -->
            </div>
        </section>
    </div>

    <script>
        const STORAGE_KEY = 'voemee_un_history';

        const exercisesByGroup = {
            "Rinta": ["Penkki", "Vinopenkki", "Flyes", "Rintaprässi"],
            "Selkä": ["Kulmasoutu", "Ylätalja", "Alatalja"],
            "Kädet & Olkapäät": ["Pystypunnerrus", "Viparit", "Hauiskääntö", "Hammer", "Ojentajat taljassa"],
            "Jalat": ["Kyykky", "Jalkaprässi", "Etureisi", "Takareisi", "Pohkeet"]
        };

        document.addEventListener('DOMContentLoaded', () => {
            updateExercises();
            loadHistory();
        });

        function updateExercises() {
            const groupSelect = document.getElementById('muscle-group');
            const exerciseSelect = document.getElementById('exercise');
            const selectedGroup = groupSelect.value;
            
            const exercises = exercisesByGroup[selectedGroup] || [];
            
            exerciseSelect.innerHTML = '';
            exercises.forEach(ex => {
                const option = document.createElement('option');
                option.value = ex;
                option.textContent = ex;
                exerciseSelect.appendChild(option);
            });
        }

        function saveEntry() {
            const group = document.getElementById('muscle-group').value;
            const exercise = document.getElementById('exercise').value;
            const weight = document.getElementById('weight').value;
            const reps = document.getElementById('reps').value;

            if (!weight || !reps) {
                alert('Syötä paino ja toistot.');
                return;
            }

            const entry = {
                id: Date.now(),
                date: new Date().toLocaleDateString('fi-FI'),
                group: group,
                exercise: exercise,
                weight: parseFloat(weight).toFixed(1),
                reps: reps
            };

            let history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            
            history = history.filter(item => item.exercise !== exercise);
            history.unshift(entry);
            history = history.slice(0, 15);

            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            
            clearFields();
            loadHistory();
        }

        function loadHistory() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';

            const history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-card"><div class="card-header">Ei suorituksia</div><div class="card-body" style="grid-template-columns: 1fr;">Tallenna ensimmäinen tuloksesi!</div></div>';
                return;
            }

            history.forEach(entry => {
                const card = document.createElement('div');
                card.className = 'history-card';
                card.innerHTML = `
                    <div class="card-header">
                        ${entry.exercise}
                        <span class="card-date">${entry.date}</span>
                    </div>
                    <div class="card-body">
                        <div class="stat-box">
                            <span class="stat-label">Ryhmä</span>
                            <span class="stat-value" style="font-size: 0.9rem;">${entry.group}</span>
                        </div>
                        <div class="stat-box">
                            <span class="stat-label">Paino</span>
                            <span class="stat-value">${entry.weight} kg</span>
                        </div>
                        <div class="stat-box">
                            <span class="stat-label">Toistot</span>
                            <span class="stat-value">${entry.reps}</span>
                        </div>
                    </div>
                `;
                historyList.appendChild(card);
            });
        }

        function clearFields() {
            document.getElementById('weight').value = '';
            document.getElementById('reps').value = '';
            document.getElementById('weight').focus();
        }

        function clearHistory() {
            if (confirm('Oletko varma, että haluat poistaa koko historian?')) {
                localStorage.removeItem(STORAGE_KEY);
                loadHistory();
            }
        }
    </script>
</body>
</html>
