<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>VOEMEE UN!</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <header class="logo-header">
            <img src="icon.png" alt="VOEMEE UN! Logo" class="logo-img">
        </header>

        <section class="input-section">
            <div class="form-group">
                <label for="muscle-group">Lihasryhmä</label>
                <div class="select-wrapper">
                    <select id="muscle-group" onchange="updateExercises()">
                        <option value="Rinta">Rinta</option>
                        <option value="Selkä">Selkä</option>
                        <option value="Kädet & Olkapäät">Kädet & Olkapäät</option>
                        <option value="Jalat">Jalat</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="exercise">Liike</label>
                <div class="select-wrapper">
                    <select id="exercise">
                        <!-- JS täyttää dynaamisesti -->
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Sarjat (Paino & Toistot)</label>
                <div id="sets-container">
                    <!-- Javascript luo sarjarivit tänne -->
                </div>
                <button type="button" class="btn-secondary" onclick="addSetRow()">+ LISÄÄ SARJA</button>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="saveEntry()">Tallenna</button>
                <button class="btn-reset" onclick="clearFields()">Tyhjennä</button>
            </div>
        </section>

        <section class="history-section">
            <div class="history-header">
                <h2 id="history-title">Viimeisimmät</h2>
                <button class="btn-clear-all" onclick="clearHistory()">Tyhjennä historia</button>
            </div>
            <div id="history-list">
                <!-- JS lataa tähän -->
            </div>
        </section>
    </div>

    <script>
        const STORAGE_KEY = 'voemee_un_history';

        const exercisesByGroup = {
            "Rinta": ["Penkki", "Vinopenkki", "Flyes", "Rintaprässi"],
            "Selkä": ["Kulmasoutu", "Ylätalja", "Alatalja"],
            "Kädet & Olkapäät": ["Pystypunnerrus", "Viparit", "Hauiskääntö", "Hammer", "Ojentajat taljassa"],
            "Jalat": ["Kyykky", "Jalkaprässi", "Etureisi", "Takareisi", "Pohkeet"]
        };

        document.addEventListener('DOMContentLoaded', () => {
            updateExercises();
            clearFields(); // Luo ensimmäisen tyhjän sarjarivin
        });

        // Päivittää liikelistan ja lataa kyseisen lihasryhmän historian
        function updateExercises() {
            const groupSelect = document.getElementById('muscle-group');
            const exerciseSelect = document.getElementById('exercise');
            const selectedGroup = groupSelect.value;
            
            const exercises = exercisesByGroup[selectedGroup] || [];
            
            exerciseSelect.innerHTML = '';
            exercises.forEach(ex => {
                const option = document.createElement('option');
                option.value = ex;
                option.textContent = ex;
                exerciseSelect.appendChild(option);
            });

            // Päivitetään historian otsikko ja lista vastaamaan valittua ryhmää
            document.getElementById('history-title').textContent = `Viimeisimmät: ${selectedGroup}`;
            loadHistory();
        }

        // Lisää uuden rivin sarjoille (paino & toistot)
        function addSetRow() {
            const container = document.getElementById('sets-container');
            const rowCount = container.children.length + 1;
            
            const row = document.createElement('div');
            row.className = 'set-row';
            row.innerHTML = `
                <span class="set-number">${rowCount}.</span>
                <input type="number" class="set-weight" inputmode="decimal" placeholder="kg" step="0.5">
                <input type="number" class="set-reps" inputmode="numeric" placeholder="toistot">
                <button class="btn-delete-set" onclick="removeSetRow(this)">×</button>
            `;
            container.appendChild(row);
        }

        // Poistaa sarjarivin ja päivittää numeroinnin
        function removeSetRow(btn) {
            btn.parentElement.remove();
            
            const rows = document.querySelectorAll('#sets-container .set-row');
            rows.forEach((row, index) => {
                row.querySelector('.set-number').textContent = `${index + 1}.`;
            });
        }

        function saveEntry() {
            const group = document.getElementById('muscle-group').value;
            const exercise = document.getElementById('exercise').value;

            const setRows = document.querySelectorAll('.set-row');
            const sets = [];
            let isValid = true;

            setRows.forEach(row => {
                const w = row.querySelector('.set-weight').value;
                const r = row.querySelector('.set-reps').value;
                
                if (w !== '' && r !== '') {
                    sets.push({ weight: parseFloat(w).toFixed(1), reps: parseInt(r) });
                } else {
                    isValid = false;
                }
            });

            if (sets.length === 0 || !isValid) {
                alert('Täytä paino ja toistot kaikkiin lisäämiisi sarjoihin.');
                return;
            }

            const entry = {
                id: Date.now(),
                date: new Date().toLocaleDateString('fi-FI'),
                group: group,
                exercise: exercise,
                sets: sets // Tallennetaan arrayna
            };

            let history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            
            // Korvataan saman liikkeen vanha tulos uudella
            history = history.filter(item => item.exercise !== exercise);
            history.unshift(entry);
            
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            
            clearFields();
            loadHistory();
        }

        function loadHistory() {
            const historyList = document.getElementById('history-list');
            const activeGroup = document.getElementById('muscle-group').value;
            historyList.innerHTML = '';

            let history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            
            // SUODATUS: Näytetään vain valitun lihasryhmän liikkeet
            history = history.filter(item => item.group === activeGroup);

            if (history.length === 0) {
                historyList.innerHTML = `<div class="history-card"><div class="card-header" style="justify-content: center; font-size: 0.9rem; color: #888;">Ei tallennettuja ${activeGroup.toLowerCase()}-treenejä.</div></div>`;
                return;
            }

            history.forEach(entry => {
                const card = document.createElement('div');
                card.className = 'history-card';
                
                // Rakennetaan sarjojen HTML-näkymä sisältäen vanhan koodin tuen
                let setsHtml = '<div class="sets-display">';
                if (entry.sets && entry.sets.length > 0) {
                    entry.sets.forEach((set, index) => {
                        setsHtml += `<div class="set-line">${index + 1}. <span>${set.weight} kg</span> × <span>${set.reps}</span></div>`;
                    });
                } else if (entry.weight && entry.reps) {
                    // Taaksepäin yhteensopivuus vanhoille tallennuksille
                    setsHtml += `<div class="set-line">1. <span>${entry.weight} kg</span> × <span>${entry.reps}</span></div>`;
                }
                setsHtml += '</div>';

                card.innerHTML = `
                    <div class="card-header">
                        <span>${entry.exercise}</span>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span class="card-date">${entry.date}</span>
                            <button class="btn-delete-item" onclick="deleteEntry(${entry.id})" title="Poista tämä">×</button>
                        </div>
                    </div>
                    ${setsHtml}
                `;
                historyList.appendChild(card);
            });
        }

        function deleteEntry(id) {
            let history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            history = history.filter(item => item.id !== id);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            loadHistory();
        }

        function clearFields() {
            document.getElementById('sets-container').innerHTML = '';
            addSetRow(); // Lisää yhden tyhjän rivin valmiiksi
        }

        function clearHistory() {
            if (confirm('Oletko varma, että haluat poistaa koko historian?')) {
                localStorage.removeItem(STORAGE_KEY);
                loadHistory();
            }
        }
    </script>
</body>
</html>
